<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>45-Challenge Grid</title>
    <link rel="stylesheet" href="../src/images/css/master.css">
    <style>
           div.gallery {
            display: grid;
            grid-template-areas: "one two three"
                                 "four two five"
                                 "six six seven";
            grid-gap: 0.2rem;
            margin: 2rem auto;
            width: 200px;
            justify-content: center;

              img {
                    background-color: #f00;
                    height: 100%;
                    width: 100%;
                    
    
                    &:first-child {
                    background-color: #00f;
                    grid-area: one;
                    width: calc(90px + 0.9rem);
                    height: 100px;
                    }
                    &:nth-child(2) {
                      grid-area: two;
                      width: calc(100px + 0.2rem);
                    }
                    &:nth-child(3) {
                      grid-area: three;
                      width: calc(100px + 0.2rem);
                    }
                    &:nth-child(4) {
                      background-color: #00f;
                      grid-area: four;
                      height: calc(100px + 0.2rem);
                    }
                    &:nth-child(5) {
                      grid-area: five;
                      width: calc(100px + 0.2rem);
                    }

                    &:nth-child(6) {
                      grid-area: six;
                      width: calc(207px + 0.2rem);
                    }
                    &:last-child {
                      grid-area: seven;
                      width: calc(100px + 0.2rem);
                    }
                }
           }

           div.gallery2 {
            display: grid;
            grid-template-columns: 80px 80px 80px 80px;
            grid-template-rows: 90px 90px 90px;
            grid-template-areas: "one one two three"
                                 "one one four four"
                                 "five six four four";
            grid-gap: 0.2rem;
            margin: 2rem auto;

            justify-content: center;

            img {
            background-color: crimson;
            width: 100%;
            height: 100%;
    
            &:first-child {
                background-color: teal;
                grid-area: one;

            }
            &:nth-child(2) {
                grid-area: two;

            }
            &:nth-child(3) {
                grid-area: three;

            }
            &:nth-child(4) {
                background-color: teal;
                grid-area: four;

            }
            &:nth-child(5) {
                grid-area: five;

            }
            &:last-child {
                grid-area: six;

            }
        }
    }
    </style>
</head>
<body class="css">
    <nav class="goback">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#fff" viewBox="0 0 256 256">
                <path d="M208,72H128V32a8,8,0,0,0-13.66-5.66l-96,96a8,8,0,0,0,0,11.32l96,96A8,8,0,0,0,128,224V184h80a16,16,0,0,0,16-16V88A16,16,0,0,0,208,72Zm0,96H120a8,8,0,0,0-8,8v28.69L35.31,128,112,51.31V80a8,8,0,0,0,8,8h88Z"></path>
            </svg>
        </a>
    </nav>
    <main>
        <header class="mmenu internal">
            <h1>45-Challenge Grid</h1>
            <img src="../src/images/logo-css.png" alt="Css">
            <h3>Grid Areas: Irregular Gallery.</h3>
        </header>
        <section>
           <h3 class="subtitle">Gallery: 1</h3>

          <div class="gallery">
              <img src="imgs/southpark2.jpg" alt="South Park" class="one">
              <img src="imgs/southpark1.jpg" alt="South Park" class="two">
              <img src="imgs/southpark3.webp" alt="South Park" class="three">
              <img src="imgs/southpark4.webp" alt="South Park" class="four">
              <img src="imgs/southpark5.jpg" alt="South Park" class="five">
              <img src="imgs/southpark6.jpeg" alt="South Park" class="six">
              <img src="imgs/southpark7.jpg" alt="South Park" class="seven">
           </div>

           <h3 class="subtitle">Gallery: 2</h3>

           <div class="gallery2">
            <img src="imgs/rickandmorty1.jpg" alt="Rick and Morty" class="one">
            <img src="imgs/rickandmorty2.jpg" alt="Rick and Morty" class="two">
            <img src="imgs/rickandmorty3.jpg" alt="Rick and Morty" class="three">
            <img src="imgs/rickandmorty4.jpg" alt="Rick and Morty" class="four">
            <img src="imgs/rickandmorty5.jpg" alt="Rick and Morty" class="five">
            <img src="imgs/rickandmorty6.jpg" alt="Rick and Morty" class="six">
           </div>
           </section>
    </main>
</body>
</html>
