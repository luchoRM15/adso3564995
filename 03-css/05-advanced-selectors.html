<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>05-advanced selectors</title>
    <link rel="stylesheet" href="../src/images/css/master.css">
    <style>
        ul.fruits > li {
            background-color: red;
            padding: 0.2rem;
        }
        ul.fruits > li[class] {
            background-color: Orange;
            padding: 0.2rem;
        }
        ul.fruits > li[class] + li {
            background-color: lime;
            padding: 0.2rem;
        }
        ul.fruits > li[class] + li + li{
            background-color: pink;
            padding: 0.2rem;
        }
        ul.fruits > li[class] + li + li + li{
            background-color: purple;
            padding: 0.2rem;
        }
    </style>
</head>
<body class="css">
    <nav class="goback">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="white" viewBox="0 0 256 256">
                <path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path>
            </svg>
        </a>
    </nav>
    <main>
        <header class="mmenu internal   ">
            <h1>05-advanced selectors</h1>
            <img src="../src/images/logo-css.png" alt="css">
            <h3>Description.</h3>
            <ul>
                <li>Children (>)</li>
                <li>Adjacent/Sibling (+)</li>
                <li>Attribute [class]</li>
            </ul>
        </header>
        <section>
            <h3 class="subtitle">Example: </h3>
            <ul class="fruits">
                <li>Apple 🍎</li>
                <li class="highlight"> Orange 🍊</li>
                <li>Lime 🍋</li>
                <li>Strawberry 🍓</li>
                <li>Grape 🍇</li>
            </ul>
        </section>
    </main>
</body>
</html>
